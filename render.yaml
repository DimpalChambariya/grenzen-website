services:
  - type: web
    name: grenzen-pharmachem
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        value: smtpout.secureserver.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: info@grenzenpharmachem.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: '"Grenzen Pharmachem Website" <info@grenzenpharmachem.com>'
      - key: EMAIL_TO
        value: info@grenzenpharmachem.com
